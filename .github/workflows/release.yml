name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'website/**'

jobs:
  deploy-website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

      - name: Deploy to volox GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.RELEASE_REPO_TOKEN }}
          external_repository: poorants/volox
          publish_branch: gh-pages
          publish_dir: ./website/dist


  build-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: |
          echo "FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env
          echo "FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env
          echo "FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}" >> .env

      - name: Build Windows
        run: npm run build:win

      - name: Upload to volox Releases
        uses: softprops/action-gh-release@v2
        with:
          repository: poorants/volox
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          files: dist/*.exe
          tag_name: ${{ github.ref_name }}
          name: Volox ${{ github.ref_name }}
          draft: false
          prerelease: false

  build-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: |
          echo "FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }}" >> .env
          echo "FIREBASE_AUTH_DOMAIN=${{ secrets.FIREBASE_AUTH_DOMAIN }}" >> .env
          echo "FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}" >> .env
          echo "FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }}" >> .env

      - name: Build macOS
        run: npm run build:mac

      - name: Upload to volox Releases
        uses: softprops/action-gh-release@v2
        with:
          repository: poorants/volox
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          files: dist/*.dmg
          tag_name: ${{ github.ref_name }}
          name: Volox ${{ github.ref_name }}
          draft: false
          prerelease: false
