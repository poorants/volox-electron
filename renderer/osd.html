<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="theme-dark.css" id="theme-variant">
  <style>
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      -webkit-app-region: no-drag;
    }
    .osd-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }
    .osd-widget {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 22px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur-md));
      -webkit-backdrop-filter: blur(var(--blur-md));
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-4xl);
      color: var(--text-primary);
      min-width: 300px;
      opacity: 0;
      transform: translateY(8px);
      transition: opacity var(--transition-normal) cubic-bezier(0.16, 1, 0.3, 1),
                  transform var(--transition-normal) cubic-bezier(0.16, 1, 0.3, 1);
    }
    .osd-widget.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .osd-widget.hiding {
      opacity: 0;
      transform: translateY(8px);
      transition: opacity var(--transition-slow) ease-in, transform var(--transition-slow) ease-in;
    }
    .osd-icon {
      font-size: var(--font-size-icon);
      width: 28px;
      text-align: center;
      flex-shrink: 0;
    }
    .osd-content { flex: 1; }
    .osd-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
    }
    .osd-label {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-medium);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .osd-value {
      font-size: var(--font-size-2xl);
      font-weight: var(--font-weight-semibold);
      color: var(--text-primary);
      line-height: 1;
    }
    .osd-bar-track {
      width: 100%;
      height: 6px;
      background: var(--bar-track);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    .osd-bar-fill {
      height: 100%;
      border-radius: var(--radius-sm);
      background: linear-gradient(90deg, var(--voly-600), var(--voly-400));
      box-shadow: 0 0 12px var(--voly-glow), 0 0 4px var(--voly-glow-strong);
      transition: width var(--transition-fast) ease-out, background 200ms ease, box-shadow 200ms ease;
      width: 0%;
    }
    .osd-bar-fill.muted {
      background: var(--mute-red);
      box-shadow: 0 0 12px var(--mute-red-glow), 0 0 4px var(--mute-red-strong);
    }
  </style>
</head>
<body>
  <div class="osd-container">
    <div class="osd-widget" id="widget">
      <div class="osd-icon" id="icon"></div>
      <div class="osd-content">
        <div class="osd-header">
          <span class="osd-label" id="label">Volume</span>
          <span class="osd-value" id="value">0%</span>
        </div>
        <div class="osd-bar-track">
          <div class="osd-bar-fill" id="bar"></div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const widget = document.getElementById('widget');
    const icon = document.getElementById('icon');
    const label = document.getElementById('label');
    const value = document.getElementById('value');
    const bar = document.getElementById('bar');

    function getVolumeIcon(v, muted) {
      if (muted) return '\u{1F507}';
      if (v === 0) return '\u{1F507}';
      if (v < 33) return '\u{1F508}';
      if (v < 66) return '\u{1F509}';
      return '\u{1F50A}';
    }

    // Theme
    window.electronAPI.getTheme().then((theme) => {
      document.getElementById('theme-variant').href = 'theme-' + theme + '.css';
    });
    window.electronAPI.onThemeChanged((theme) => {
      document.getElementById('theme-variant').href = 'theme-' + theme + '.css';
    });

    window.electronAPI.onOsdUpdate((data) => {
      if (data.action === 'show') {
        const isMuted = data.isMuted || false;
        icon.textContent = getVolumeIcon(data.value, isMuted);
        label.textContent = isMuted ? 'Muted' : 'Volume';
        value.textContent = isMuted ? 'OFF' : data.value + '%';
        bar.style.width = (isMuted ? 0 : data.value) + '%';
        bar.classList.toggle('muted', isMuted);
        widget.classList.remove('hiding');
        requestAnimationFrame(() => widget.classList.add('visible'));
      } else {
        widget.classList.add('hiding');
        widget.classList.remove('visible');
      }
    });
  </script>
</body>
</html>
