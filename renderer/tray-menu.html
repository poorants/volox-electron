<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --voly-400: #A78BFA;
      --voly-500: #8B5CF6;
      --voly-600: #7C3AED;
      --voly-glow: rgba(139, 92, 246, 0.4);
      --voly-glow-strong: rgba(139, 92, 246, 0.6);
      --surface-0: #09090B;
      --surface-1: #18181B;
      --surface-2: #27272A;
      --border: #3F3F46;
      --border-accent: rgba(139, 92, 246, 0.2);
      --text-primary: #FAFAFA;
      --text-secondary: #A1A1AA;
      --text-tertiary: #71717A;
      --mute-red: #EF4444;
      --mute-red-glow: rgba(239, 68, 68, 0.4);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
    }
    .menu {
      margin: 8px;
      background: rgba(9, 9, 11, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-accent);
      border-radius: 14px;
      padding: 10px 0;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 1px rgba(139,92,246,0.15);
    }

    /* Volume section */
    .volume-section {
      padding: 8px 16px 12px;
    }
    .volume-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .volume-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }
    .volume-value {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
    }
    .volume-value.muted {
      color: var(--mute-red);
    }

    /* Slider */
    .slider-track {
      position: relative;
      width: 100%;
      height: 6px;
      background: var(--surface-2);
      border-radius: 3px;
      cursor: pointer;
    }
    .slider-fill {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--voly-600), var(--voly-400));
      box-shadow: 0 0 10px var(--voly-glow);
      transition: width 60ms ease-out;
      pointer-events: none;
    }
    .slider-fill.muted {
      background: var(--mute-red);
      box-shadow: 0 0 10px var(--mute-red-glow);
    }
    .slider-thumb {
      position: absolute;
      top: 50%;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--voly-500);
      box-shadow: 0 0 8px var(--voly-glow);
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: left 60ms ease-out;
    }
    .slider-thumb.muted {
      background: var(--mute-red);
      box-shadow: 0 0 8px var(--mute-red-glow);
    }

    /* Separator */
    .sep {
      height: 1px;
      margin: 6px 12px;
      background: var(--border);
      opacity: 0.5;
    }

    /* Menu item */
    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 16px;
      font-size: 13px;
      color: var(--text-primary);
      cursor: pointer;
      transition: background 0.12s;
    }
    .menu-item:hover {
      background: rgba(139, 92, 246, 0.1);
    }
    .menu-item:active {
      background: rgba(139, 92, 246, 0.18);
    }
    .menu-item .icon {
      width: 18px;
      text-align: center;
      font-size: 14px;
      flex-shrink: 0;
    }
    .menu-item.muted .icon {
      color: var(--mute-red);
    }
    .menu-item.quit:hover {
      background: rgba(239, 68, 68, 0.1);
    }
    .menu-item.quit:hover .label {
      color: #FCA5A5;
    }
  </style>
</head>
<body>
  <div class="menu">
    <div class="volume-section">
      <div class="volume-header">
        <span class="volume-label" id="vol-label">Volume</span>
        <span class="volume-value" id="vol-value">0%</span>
      </div>
      <div class="slider-track" id="slider-track">
        <div class="slider-fill" id="slider-fill"></div>
        <div class="slider-thumb" id="slider-thumb"></div>
      </div>
    </div>

    <div class="sep"></div>

    <div class="menu-item" id="btn-mute">
      <span class="icon" id="mute-icon">&#x1F50A;</span>
      <span class="label" id="mute-label">Mute</span>
    </div>

    <div class="sep"></div>

    <div class="menu-item" id="btn-settings">
      <span class="icon">&#x2699;</span>
      <span class="label">Settings</span>
    </div>
    <div class="menu-item quit" id="btn-quit">
      <span class="icon">&#x2715;</span>
      <span class="label">Quit</span>
    </div>
  </div>

  <script>
    const volLabel = document.getElementById('vol-label');
    const volValue = document.getElementById('vol-value');
    const sliderTrack = document.getElementById('slider-track');
    const sliderFill = document.getElementById('slider-fill');
    const sliderThumb = document.getElementById('slider-thumb');
    const muteIcon = document.getElementById('mute-icon');
    const muteLabel = document.getElementById('mute-label');
    const btnMute = document.getElementById('btn-mute');

    let currentVolume = 0;
    let isMuted = false;
    let dragging = false;

    function updateUI(vol, muted) {
      currentVolume = vol;
      isMuted = muted;

      volLabel.textContent = muted ? 'Muted' : 'Volume';
      volValue.textContent = muted ? 'OFF' : vol + '%';
      volValue.classList.toggle('muted', muted);

      sliderFill.style.width = (muted ? 0 : vol) + '%';
      sliderFill.classList.toggle('muted', muted);
      sliderThumb.style.left = (muted ? 0 : vol) + '%';
      sliderThumb.classList.toggle('muted', muted);

      if (muted) {
        muteIcon.textContent = '\u{1F507}';
        muteLabel.textContent = 'Unmute';
        btnMute.classList.add('muted');
      } else {
        muteIcon.textContent = vol < 33 ? '\u{1F508}' : vol < 66 ? '\u{1F509}' : '\u{1F50A}';
        muteLabel.textContent = 'Mute';
        btnMute.classList.remove('muted');
      }
    }

    // Slider drag
    function setVolumeFromX(clientX) {
      const rect = sliderTrack.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      const vol = Math.round(ratio * 100);
      updateUI(vol, false);
      window.electronAPI.setVolume(vol);
    }

    sliderTrack.addEventListener('mousedown', (e) => {
      dragging = true;
      setVolumeFromX(e.clientX);
    });
    document.addEventListener('mousemove', (e) => {
      if (dragging) setVolumeFromX(e.clientX);
    });
    document.addEventListener('mouseup', () => { dragging = false; });

    // Buttons
    btnMute.addEventListener('click', async () => {
      const result = await window.electronAPI.trayToggleMute();
      if (result) updateUI(result.volume, result.muted);
    });

    document.getElementById('btn-settings').addEventListener('click', () => {
      window.electronAPI.openSettings();
    });

    document.getElementById('btn-quit').addEventListener('click', () => {
      window.electronAPI.quitApp();
    });

    // Receive state when menu is shown
    window.electronAPI.onTrayMenuUpdate((data) => {
      if (data.action === 'show') {
        updateUI(data.volume, data.muted);
      }
    });

    // Initial state
    (async () => {
      const state = await window.electronAPI.getTrayMenuState();
      if (state) updateUI(state.volume, state.muted);
    })();
  </script>
</body>
</html>
