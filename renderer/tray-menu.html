<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="theme-dark.css" id="theme-variant">
  <style>
    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
    }
    .menu {
      margin: 8px;
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur-lg));
      -webkit-backdrop-filter: blur(var(--blur-lg));
      border: 1px solid var(--border-accent);
      border-radius: var(--radius-3xl);
      padding: 6px 0;
      box-shadow: var(--shadow-menu);
    }

    /* Separator */
    .sep {
      height: 1px;
      margin: 4px 12px;
      background: var(--border);
      opacity: 0.5;
    }

    /* Menu item */
    .menu-item {
      padding: 8px 16px;
      font-size: var(--font-size-md);
      color: var(--text-primary);
      cursor: pointer;
      transition: background var(--transition-fast);
    }
    .menu-item:hover {
      background: var(--voly-hover);
    }
    .menu-item:active {
      background: var(--voly-active);
    }
    .menu-item.quit:hover {
      background: var(--mute-red-hover);
      color: var(--mute-red-light);
    }
  </style>
</head>
<body>
  <div class="menu">
    <div class="menu-item" id="btn-theme">Theme</div>
    <div class="menu-item" id="btn-settings">Settings</div>
    <div class="sep"></div>
    <div class="menu-item quit" id="btn-quit">Quit</div>
  </div>

  <script>
    document.getElementById('btn-theme').addEventListener('click', () => {
      window.electronAPI.openThemePicker();
    });

    document.getElementById('btn-settings').addEventListener('click', () => {
      window.electronAPI.openSettings();
    });

    document.getElementById('btn-quit').addEventListener('click', () => {
      window.electronAPI.quitApp();
    });

    // Theme
    window.electronAPI.onThemeChanged((theme) => {
      document.getElementById('theme-variant').href = 'theme-' + theme + '.css';
    });

    // Initial theme
    window.electronAPI.getTheme().then((theme) => {
      document.getElementById('theme-variant').href = 'theme-' + (theme || 'dark') + '.css';
    });
  </script>
</body>
</html>
