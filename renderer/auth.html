<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <script src="tauri-bridge.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jaro:opsz@6..72&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="theme-dark.css" id="theme-variant">
  <style>
    html, body {
      width: 100%; height: 100%;
      margin: 0; padding: 0;
      overflow: hidden;
      background: var(--bg-primary);
      font-family: var(--font-family);
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding: 24px;
      box-sizing: border-box;
      -webkit-app-region: drag;
    }

    .logo {
      font-family: 'Jaro', sans-serif;
      font-size: 32px;
      font-weight: 400;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      margin-bottom: 32px;
    }

    .btn-google {
      -webkit-app-region: no-drag;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 32px;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background: var(--glass-bg);
      color: var(--text-primary);
      font-size: var(--font-size-md);
      font-weight: 600;
      cursor: pointer;
      transition: all var(--transition-fast);
      backdrop-filter: blur(var(--blur-sm));
    }

    .btn-google:hover {
      border-color: var(--volox-primary);
      box-shadow: 0 0 20px rgba(139, 92, 246, 0.2);
      transform: translateY(-1px);
    }

    .btn-google:active {
      transform: translateY(0);
    }

    .btn-google svg {
      width: 20px;
      height: 20px;
    }

    .close-wrapper {
      -webkit-app-region: no-drag;
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 9999;
    }

    .btn-close {
      width: 32px;
      height: 32px;
      border: none;
      border-radius: var(--radius-lg);
      background: transparent;
      color: var(--text-secondary);
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition-fast);
    }

    .btn-close:hover {
      background: var(--volox-hover);
      color: var(--text-primary);
    }

    .btn-close:hover {
      background: var(--volox-hover);
      color: var(--text-primary);
    }

    .status {
      margin-top: 24px;
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      min-height: 20px;
    }

    .status.error {
      color: var(--mute-red-light);
    }

    .spinner {
      display: none;
      width: 24px;
      height: 24px;
      border: 3px solid var(--border);
      border-top-color: var(--volox-primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 24px;
    }

    .spinner.visible { display: block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container" data-tauri-drag-region>
    <div class="close-wrapper">
      <button class="btn-close" id="btn-close">✕</button>
    </div>
    <div class="logo">VOLOX</div>
    <div class="subtitle">Sign in to Volox</div>

    <button class="btn-google" id="btn-google">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>

    <div class="spinner" id="spinner"></div>
    <div class="status" id="status"></div>
  </div>

  <script>
    document.getElementById('btn-close').addEventListener('click', () => {
      window.close();
    });
  </script>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js';
    import { getAuth, signInWithPopup, GoogleAuthProvider } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js';
    import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js';

    const config = await window.electronAPI.getFirebaseConfig();
    const app = initializeApp(config);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    const btnGoogle = document.getElementById('btn-google');
    const spinner = document.getElementById('spinner');
    const status = document.getElementById('status');
    let isAuthInProgress = false;
    let popupCheckInterval = null;
    let authPopup = null;

    // Intercept window.open to track popup
    const originalOpen = window.open;
    window.open = function(...args) {
      const popup = originalOpen.apply(this, args);
      if (isAuthInProgress && popup) {
        authPopup = popup;
        startPopupCheck();
      }
      return popup;
    };

    function startPopupCheck() {
      if (popupCheckInterval) clearInterval(popupCheckInterval);
      popupCheckInterval = setInterval(() => {
        if (authPopup && authPopup.closed) {
          clearInterval(popupCheckInterval);
          popupCheckInterval = null;
          authPopup = null;
          // Give Firebase a moment to process, then reset if still in progress
          setTimeout(() => {
            if (isAuthInProgress) {
              status.textContent = 'Sign-in cancelled.';
              resetAuthState();
              // Auto close after showing message
              setTimeout(() => window.close(), 800);
            }
          }, 300);
        }
      }, 200);
    }

    function resetAuthState() {
      isAuthInProgress = false;
      btnGoogle.disabled = false;
      spinner.classList.remove('visible');
      if (popupCheckInterval) {
        clearInterval(popupCheckInterval);
        popupCheckInterval = null;
      }
      authPopup = null;
    }

    btnGoogle.addEventListener('click', async () => {
      if (isAuthInProgress) return;
      isAuthInProgress = true;
      btnGoogle.disabled = true;
      spinner.classList.add('visible');
      status.textContent = '';
      status.className = 'status';

      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        // Upsert user document in Firestore
        await setDoc(doc(db, 'users', user.uid), {
          uid: user.uid,
          email: user.email,
          displayName: user.displayName,
          photoURL: user.photoURL,
          lastLoginAt: serverTimestamp(),
        }, { merge: true });

        // Set createdAt only if it doesn't exist yet (first login)
        const userDoc = await getDoc(doc(db, 'users', user.uid));
        if (!userDoc.data().createdAt) {
          await setDoc(doc(db, 'users', user.uid), { createdAt: serverTimestamp() }, { merge: true });
        }

        // Initialize subscription if it doesn't exist
        const subDoc = await getDoc(doc(db, 'subscriptions', user.uid));
        let subscription;
        if (!subDoc.exists()) {
          subscription = { plan: 'free', status: 'active' };
          await setDoc(doc(db, 'subscriptions', user.uid), {
            uid: user.uid,
            ...subscription,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp(),
          });
        } else {
          subscription = { plan: subDoc.data().plan, status: subDoc.data().status };
        }

        // Cache subscription locally
        await window.electronAPI.saveSubscription(subscription);

        await window.electronAPI.signIn({
          uid: user.uid,
          email: user.email,
          displayName: user.displayName,
          photoURL: user.photoURL,
        });

        status.textContent = 'Signed in!';
        setTimeout(() => window.electronAPI.closeAuthWindow(), 500);
      } catch (err) {
        if (err.code === 'auth/popup-closed-by-user' || err.code === 'auth/cancelled-popup-request') {
          status.textContent = 'Sign-in cancelled.';
          setTimeout(() => window.close(), 800);
        } else {
          status.textContent = err.message;
          status.className = 'status error';
        }
        resetAuthState();
      }
    });

    // Theme
    window.electronAPI.getTheme().then((theme) => {
      document.getElementById('theme-variant').href = 'theme-' + (theme || 'dark') + '.css';
    });
    window.electronAPI.onThemeChanged((theme) => {
      document.getElementById('theme-variant').href = 'theme-' + theme + '.css';
    });
  </script>
</body>
</html>
