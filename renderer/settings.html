<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Volox Settings</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="theme-dark.css" id="theme-variant">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jaro:opsz@6..72&display=swap" rel="stylesheet">
  <style>
    body {
      background: var(--surface-0);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Custom Titlebar */
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 40px;
      min-height: 40px;
      padding: 0 6px 0 16px;
      -webkit-app-region: drag;
      border-bottom: 1px solid var(--border);
    }
    .titlebar-title {
      font-size: var(--font-size-sm);
      font-weight: var(--font-weight-semibold);
      color: var(--text-secondary);
      letter-spacing: 0.02em;
    }
    .titlebar-close {
      -webkit-app-region: no-drag;
      width: 32px; height: 32px;
      background: transparent;
      border: none;
      border-radius: var(--radius-md);
      color: var(--text-tertiary);
      font-size: var(--font-size-lg);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background var(--transition-normal), color var(--transition-normal);
    }
    .titlebar-close:hover {
      background: var(--mute-red-hover);
      color: var(--mute-red);
    }

    /* Scrollable Content */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 20px 24px 20px;
    }

    /* Custom Scrollbar */
    .content::-webkit-scrollbar {
      width: 6px;
    }
    .content::-webkit-scrollbar-track {
      background: transparent;
    }
    .content::-webkit-scrollbar-thumb {
      background: var(--volox-600);
      border-radius: var(--radius-sm);
    }
    .content::-webkit-scrollbar-thumb:hover {
      background: var(--volox-500);
      box-shadow: 0 0 8px var(--volox-glow);
    }

    /* Header */
    .header {
      margin-bottom: 28px;
    }
    .header h1 {
      font-family: 'Jaro', sans-serif;
      font-size: 28px;
      font-weight: 400;
      line-height: 1.2;
      color: var(--text-primary);
    }
    .header p {
      font-size: var(--font-size-xs);
      color: var(--text-tertiary);
      letter-spacing: 0.02em;
      margin-top: 2px;
    }

    /* Section */
    .section {
      margin-bottom: 16px;
    }
    .section-title {
      font-size: var(--font-size-xs);
      font-weight: var(--font-weight-semibold);
      color: var(--text-tertiary);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 8px;
      padding-left: 2px;
    }
    .section-body {
      background: var(--surface-1);
      border: 1px solid var(--border);
      border-radius: var(--radius-2xl);
      padding: 14px 16px;
    }

    /* Shortcut Row */
    .shortcut-row {
      padding: 8px 0;
    }
    .shortcut-row + .shortcut-row {
      border-top: 1px solid var(--border-subtle);
      margin-top: 4px;
      padding-top: 12px;
    }
    .shortcut-label {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      margin-bottom: 6px;
    }
    .shortcut-field-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .shortcut-field {
      flex: 1;
      background: var(--surface-2);
      border: 1px solid transparent;
      border-radius: var(--radius-lg);
      padding: 10px 14px;
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-medium);
      color: var(--text-primary);
      cursor: pointer;
      transition: border-color var(--transition-normal), box-shadow var(--transition-normal);
      text-transform: capitalize;
    }
    .shortcut-field:hover {
      border-color: var(--border);
    }
    .shortcut-field.capturing {
      border-color: var(--volox-500);
      color: var(--text-tertiary);
      animation: capture-pulse 1.5s infinite;
    }
    .shortcut-field.captured {
      border-color: var(--volox-500);
      transition: border-color 1s ease;
    }
    @keyframes capture-pulse {
      0%, 100% { border-color: var(--volox-500); box-shadow: 0 0 8px var(--volox-glow); }
      50% { border-color: var(--volox-400); box-shadow: 0 0 16px var(--volox-glow-strong); }
    }
    .btn-reset-shortcut {
      width: 32px; height: 32px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: var(--radius-md);
      color: var(--text-tertiary);
      font-size: 16px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: color var(--transition-normal), border-color var(--transition-normal);
    }
    .btn-reset-shortcut:hover {
      color: var(--volox-400);
      border-color: var(--border);
    }

    /* Slider */
    .slider-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 4px 0;
    }
    .slider-row label {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .slider-row input[type="range"] {
      flex: 1;
      -webkit-appearance: none;
      appearance: none;
      height: 4px;
      background: var(--surface-2);
      border-radius: 2px;
      outline: none;
    }
    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px; height: 16px;
      border-radius: var(--radius-full);
      background: var(--volox-500);
      cursor: pointer;
      box-shadow: 0 0 8px var(--volox-glow);
      transition: box-shadow var(--transition-normal);
    }
    .slider-row input[type="range"]::-webkit-slider-thumb:hover {
      box-shadow: 0 0 14px var(--volox-glow-strong);
    }
    .slider-value {
      font-size: var(--font-size-md);
      font-weight: var(--font-weight-semibold);
      color: var(--text-primary);
      min-width: 28px;
      text-align: right;
    }

    /* Toggle Switch */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }
    .toggle-row > label:first-child {
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
    }
    .toggle-switch {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--surface-2);
      border-radius: 11px;
      transition: background var(--transition-normal);
    }
    .toggle-slider::before {
      content: '';
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      top: 3px;
      background: var(--text-tertiary);
      border-radius: 50%;
      transition: transform var(--transition-normal), background var(--transition-normal);
    }
    .toggle-switch input:checked + .toggle-slider {
      background: var(--volox-600);
      box-shadow: 0 0 8px var(--volox-glow);
    }
    .toggle-switch input:checked + .toggle-slider::before {
      transform: translateX(18px);
      background: white;
    }

    /* Buttons */
    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 24px;
      justify-content: center;
    }
    .btn {
      padding: 10px 28px;
      border-radius: var(--radius-lg);
      border: none;
      font-size: var(--font-size-lg);
      font-weight: var(--font-weight-semibold);
      cursor: pointer;
      transition: background var(--transition-normal), box-shadow var(--transition-normal), transform 0.1s;
    }
    .btn:active { transform: scale(0.97); }
    .btn-save {
      background: var(--volox-600);
      color: white;
      box-shadow: 0 0 16px var(--volox-glow);
    }
    .btn-save:hover {
      background: var(--volox-500);
      box-shadow: 0 0 24px var(--volox-glow-strong);
    }
    .btn-save.saved {
      background: var(--success);
      box-shadow: 0 0 16px var(--success-glow);
    }
    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover {
      background: var(--surface-1);
      color: var(--text-primary);
    }

    /* Footer */
    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: var(--font-size-xs);
      color: var(--text-tertiary);
    }
  </style>
</head>
<body>

  <div class="titlebar">
    <span class="titlebar-title">Volox Settings</span>
    <button class="titlebar-close" id="titlebar-close">&#x2715;</button>
  </div>

  <div class="content">

  <div class="header">
    <h1>VOLOX</h1>
    <p>Volume, the way it should be.</p>
  </div>

  <div class="section">
    <div class="section-title">Shortcuts</div>
    <div class="section-body">
      <div class="shortcut-row">
        <div class="shortcut-label">Volume Up</div>
        <div class="shortcut-field-wrapper">
          <div class="shortcut-field" id="field-volumeUp" data-action="volumeUp">Alt + Wheel Up</div>
          <button class="btn-reset-shortcut" data-action="volumeUp" title="Reset to default">&#x21BB;</button>
        </div>
      </div>
      <div class="shortcut-row">
        <div class="shortcut-label">Volume Down</div>
        <div class="shortcut-field-wrapper">
          <div class="shortcut-field" id="field-volumeDown" data-action="volumeDown">Alt + Wheel Down</div>
          <button class="btn-reset-shortcut" data-action="volumeDown" title="Reset to default">&#x21BB;</button>
        </div>
      </div>
      <div class="shortcut-row">
        <div class="shortcut-label">Mute Toggle</div>
        <div class="shortcut-field-wrapper">
          <div class="shortcut-field" id="field-mute" data-action="mute">Alt + Middle Click</div>
          <button class="btn-reset-shortcut" data-action="mute" title="Reset to default">&#x21BB;</button>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Volume</div>
    <div class="section-body">
      <div class="slider-row">
        <label>Step Size</label>
        <input type="range" id="vol-step" min="1" max="10" value="2">
        <span class="slider-value" id="vol-step-value">2%</span>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">General</div>
    <div class="section-body">
      <div class="toggle-row">
        <label>Launch at startup</label>
        <label class="toggle-switch">
          <input type="checkbox" id="auto-start">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>
  </div>

  <div class="buttons">
    <button class="btn btn-save" id="save-btn">Save</button>
    <button class="btn btn-ghost" id="close-btn">Close</button>
  </div>

  <div class="footer">v2.0.0</div>

  </div><!-- .content -->

  <script>
    const TRIGGER_LABELS = {
      wheelUp: 'Wheel Up',
      wheelDown: 'Wheel Down',
      middleClick: 'Middle Click',
      arrowUp: 'Up Arrow',
      arrowDown: 'Down Arrow',
      keyM: 'M Key',
    };
    const platform = window.electronAPI.platform;
    const DEFAULTS = platform === 'darwin'
      ? {
          volumeUp: { modifier: 'alt', trigger: 'arrowUp' },
          volumeDown: { modifier: 'alt', trigger: 'arrowDown' },
          mute: { modifier: 'alt', trigger: 'keyM' },
        }
      : {
          volumeUp: { modifier: 'alt', trigger: 'wheelUp' },
          volumeDown: { modifier: 'alt', trigger: 'wheelDown' },
          mute: { modifier: 'alt', trigger: 'middleClick' },
        };

    let currentSettings = null;
    let capturingField = null;

    function shortcutText(sc) {
      const mod = sc.modifier.charAt(0).toUpperCase() + sc.modifier.slice(1);
      return mod + ' + ' + (TRIGGER_LABELS[sc.trigger] || sc.trigger);
    }

    function updateFieldDisplay(actionId, sc) {
      document.getElementById('field-' + actionId).textContent = shortcutText(sc);
    }

    async function init() {
      currentSettings = await window.electronAPI.getSettings();
      const sc = currentSettings.shortcuts || DEFAULTS;
      updateFieldDisplay('volumeUp', sc.volumeUp || DEFAULTS.volumeUp);
      updateFieldDisplay('volumeDown', sc.volumeDown || DEFAULTS.volumeDown);
      updateFieldDisplay('mute', sc.mute || DEFAULTS.mute);

      const step = (currentSettings.volume && currentSettings.volume.step) || 2;
      document.getElementById('vol-step').value = step;
      document.getElementById('vol-step-value').textContent = step + '%';

      document.getElementById('auto-start').checked = !!currentSettings.autoStart;
    }

    // Slider live update
    document.getElementById('vol-step').addEventListener('input', (e) => {
      document.getElementById('vol-step-value').textContent = e.target.value + '%';
    });

    // Shortcut field click → capture mode
    document.querySelectorAll('.shortcut-field').forEach(field => {
      field.addEventListener('click', () => {
        // Cancel previous capture
        if (capturingField) {
          capturingField.classList.remove('capturing');
          window.electronAPI.cancelCapture();
        }
        capturingField = field;
        field.classList.add('capturing');
        field.textContent = 'Press shortcut...';
        window.electronAPI.startCapture(field.dataset.action);
      });
    });

    // Capture result from main
    window.electronAPI.onCaptureResult((result) => {
      if (capturingField && capturingField.dataset.action === result.actionId) {
        capturingField.classList.remove('capturing');
        capturingField.classList.add('captured');
        const sc = { modifier: result.modifier, trigger: result.trigger };
        updateFieldDisplay(result.actionId, sc);

        if (!currentSettings.shortcuts) currentSettings.shortcuts = {};
        currentSettings.shortcuts[result.actionId] = sc;

        setTimeout(() => capturingField.classList.remove('captured'), 1000);
        capturingField = null;
      }
    });

    // Reset buttons
    document.querySelectorAll('.btn-reset-shortcut').forEach(btn => {
      btn.addEventListener('click', () => {
        const actionId = btn.dataset.action;
        const def = DEFAULTS[actionId];
        updateFieldDisplay(actionId, def);
        if (!currentSettings.shortcuts) currentSettings.shortcuts = {};
        currentSettings.shortcuts[actionId] = { ...def };
      });
    });

    // ESC to cancel capture
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && capturingField) {
        capturingField.classList.remove('capturing');
        const actionId = capturingField.dataset.action;
        const sc = (currentSettings.shortcuts && currentSettings.shortcuts[actionId]) || DEFAULTS[actionId];
        updateFieldDisplay(actionId, sc);
        window.electronAPI.cancelCapture();
        capturingField = null;
      }
    });

    // Save
    document.getElementById('save-btn').addEventListener('click', async () => {
      const settings = {
        shortcuts: currentSettings.shortcuts || { ...DEFAULTS },
        volume: {
          step: parseInt(document.getElementById('vol-step').value),
        },
        autoStart: document.getElementById('auto-start').checked,
      };
      await window.electronAPI.saveSettings(settings);
      const btn = document.getElementById('save-btn');
      btn.textContent = 'Saved!';
      btn.classList.add('saved');
      setTimeout(() => { btn.textContent = 'Save'; btn.classList.remove('saved'); }, 2000);
    });

    // Close
    document.getElementById('close-btn').addEventListener('click', () => window.close());
    document.getElementById('titlebar-close').addEventListener('click', () => window.close());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !capturingField) window.close();
    });

    // Theme
    window.electronAPI.getTheme().then((theme) => {
      document.getElementById('theme-variant').href = 'theme-' + theme + '.css';
    });
    window.electronAPI.onThemeChanged((theme) => {
      document.getElementById('theme-variant').href = 'theme-' + theme + '.css';
    });

    init();
  </script>
</body>
</html>
