<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Volox</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jaro:opsz@6..72&display=swap" rel="stylesheet">
  <style>
    :root {
      --violet-400: #A78BFA;
      --violet-500: #8B5CF6;
      --violet-600: #7C3AED;
      --glow: rgba(139, 92, 246, 0.45);
    }
    html, body {
      width: 100%; height: 100%;
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      user-select: none;
    }
    .stage {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%; height: 100%;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 34px 48px 30px;
      background: rgba(9, 9, 11, 0.85);
      border: 1px solid rgba(139, 92, 246, 0.25);
      border-radius: 18px;
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.55), 0 0 1px rgba(139, 92, 246, 0.2);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      opacity: 0;
      transform: translateY(8px) scale(0.98);
      animation: enter 420ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes enter {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .logo {
      font-family: 'Jaro', sans-serif;
      font-size: 46px;
      line-height: 1;
      font-weight: 400;
      color: #FAFAFA;
      letter-spacing: 0.01em;
      text-shadow: 0 0 18px var(--glow);
    }
    .tagline {
      font-size: 12px;
      color: #A1A1AA;
      letter-spacing: 0.02em;
      margin-bottom: 14px;
    }
    .bar {
      position: relative;
      width: 180px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .bar::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 40%;
      border-radius: 3px;
      background: linear-gradient(90deg, var(--violet-600), var(--violet-400));
      box-shadow: 0 0 10px var(--glow);
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { left: -45%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="card">
      <div class="logo">VOLOX</div>
      <div class="tagline">Volume, the way it should be.</div>
      <div class="bar"></div>
    </div>
  </div>
</body>
</html>
